name: CMake Build & Report

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR 编号（若想将结果评论到指定 PR，请输入数字；留空则仅编译不评论）'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  build-and-comment:
    runs-on: ubuntu-latest

    steps:
      - name: Post pending PR comment
        id: pending-comment
        # Fork PR 的只读 token 等评论权限问题不应阻止编译。
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number || context.payload.inputs?.pr_number;
            if (!prNumber) {
              console.log('未指定 PR，跳过评论。');
              return;
            }
            if (!/^[1-9]\d*$/.test(String(prNumber))) {
              throw new Error('PR 编号必须是正整数。');
            }
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: comment } = await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(prNumber),
              body: `### ⏳ 正在进行编译检查\n\n[查看检查进度](${runUrl})`
            });
            core.setOutput('comment_id', String(comment.id));

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ARM GCC Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: 'latest'

      - name: Configure, Build and Parse Logs
        id: build
        shell: bash
        run: |
          # tee 保留完整 Actions 日志；暂缓失败退出，先生成报告和评论。
          set +e
          cmake -B build/Debug -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -eq 0 ]; then
            cmake --build build/Debug 2>&1 | tee -a build.log
            result=${PIPESTATUS[0]}
          fi
          set -e
          if [ "$result" -eq 0 ]; then
            export BUILD_STATUS=success
          else
            export BUILD_STATUS=failure
          fi
          echo "BUILD_STATUS=$BUILD_STATUS" >> "$GITHUB_ENV"
          echo "status=$BUILD_STATUS" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          log = Path("build.log").read_text(encoding="utf-8", errors="replace")
          log = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", log)
          lines = log.splitlines()
          warning = re.compile(r"\bwarning:|CMake Warning", re.I)
          error = re.compile(r"\b(?:fatal )?error:|CMake Error|undefined reference|multiple definition|region .*overflowed|(?:g?make)(?:\[\d+\])?: \*\*\*", re.I)
          warnings = sum(bool(warning.search(line)) for line in lines)
          errors = sum(bool(error.search(line)) for line in lines)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"WARNINGS={warnings}\nERRORS={errors}\n")

          # 合并重叠上下文，保留源码行、插入符和 CMake 的调用信息。
          selected = set()
          for i, line in enumerate(lines):
              if warning.search(line) or error.search(line):
                  selected.update(range(max(0, i - 2), min(len(lines), i + 6)))
          # 未识别的失败也展示尾部日志，不以零条诊断误判为编译成功。
          if not selected and os.environ["BUILD_STATUS"] == "failure":
              selected.update(range(max(0, len(lines) - 60), len(lines)))
          excerpt = []
          previous = -1
          for i in sorted(selected):
              if previous >= 0 and i > previous + 1:
                  excerpt.append("...")
              excerpt.append(lines[i])
              previous = i
          # 控制 PR 评论长度，完整日志仍可在 Actions 中查看。
          diagnostic = "\n".join(excerpt[:160])
          if len(excerpt) > 160 or len(diagnostic) > 16000:
              diagnostic = diagnostic[:16000] + "\n...（摘录已截断，请查看完整 Actions 日志）"
          Path("diagnostics.log").write_text(diagnostic, encoding="utf-8")
          if diagnostic:
              print("::group::Warning / Error 关键日志")
              # 不将日志中的字符串解释为 Actions workflow commands。
              print("::stop-commands::cmake-diagnostic-output")
              print(diagnostic)
              print("::cmake-diagnostic-output::")
              print("::endgroup::")

          memory = []
          for i, line in enumerate(lines):
              if "Memory region" in line:
                  memory.append(line)
                  for row in lines[i + 1:]:
                      if not re.match(r"\s*\S+:\s+\d", row):
                          break
                      memory.append(row)
                  break
          Path("memory-report.log").write_text("\n".join(memory), encoding="utf-8")
          PY

      - name: Update PR comment with build report
        uses: actions/github-script@v7
        if: ${{ always() && steps.pending-comment.outputs.comment_id != '' }}
        continue-on-error: true
        env:
          COMMENT_ID: ${{ steps.pending-comment.outputs.comment_id }}
          BUILD_CANCELLED: ${{ job.status == 'cancelled' }}
        with:
          script: |
            const fs = require('fs');
            const readLog = path => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
            // 使用足够长的围栏，避免日志中的反引号破坏 Markdown。
            const codeBlock = text => {
              const longest = Math.max(0, ...(text.match(/`+/g) || []).map(run => run.length));
              const fence = '`'.repeat(Math.max(3, longest + 1));
              return `${fence}text\n${text}\n${fence}`;
            };
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (process.env.BUILD_CANCELLED === 'true') {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: Number(process.env.COMMENT_ID),
                body: `### ⏹️ 编译检查已取消\n\n本次检查已被取消（例如分支有新的提交）。\n\n[查看检查日志](${runUrl})`
              });
              return;
            }
            
            const warnings = process.env.WARNINGS ?? '未统计';
            const errors = process.env.ERRORS ?? '未统计';
            const status = process.env.BUILD_STATUS;
            const memoryReport = readLog('memory-report.log');
            const diagnostics = readLog('diagnostics.log');
            
            const isSuccess = status === "success";
            const statusEmoji = isSuccess ? "✅" : "❌";
            const statusText = isSuccess ? "编译检查通过" : "编译检查失败";
            
            // 构建基础报告
            let body = `### ${statusEmoji} ${statusText}
            
            共发现 🔴 \`${errors}\` Errors，🟡 \`${warnings}\` Warnings。

            [查看编译日志](${runUrl})
            `;
            
            if (diagnostics) {
              body += `\n### 🔎 Warning / Error 关键日志\n${codeBlock(diagnostics)}\n`;
            }

            if (memoryReport) {
              body += `\n### 📊 固件内存分配报告 (Memory Region)\n${codeBlock(memoryReport)}\n`;
            }
            
            await github.rest.issues.updateComment({
              comment_id: Number(process.env.COMMENT_ID),
              ...context.repo,
              body: body
            });

      - name: Fail workflow if compilation failed
        if: ${{ always() && !cancelled() && steps.build.outputs.status == 'failure' }}
        run: exit 1
